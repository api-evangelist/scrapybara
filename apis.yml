name: Scrapybara
kind: company
description: Scrapybara provides virtual desktops for AI agents - remote Ubuntu, browser,
  and Windows instances that computer-use models can see and control. A single x-api-key
  REST API starts and manages cloud instances, streams the desktop, runs computer /
  keyboard / mouse actions, drives Chromium over Playwright CDP, executes bash and
  code, manages the filesystem and Jupyter notebooks, and saves reusable browser auth
  states.
