aid: scrapybara
url: https://raw.githubusercontent.com/api-evangelist/scrapybara/refs/heads/main/apis.yml
name: Scrapybara
kind: company
description: Scrapybara provides virtual desktops for AI agents - remote Ubuntu, browser,
  and Windows instances that computer-use models can see and control. A single x-api-key
  REST API starts and manages cloud instances, streams the desktop, runs computer /
  keyboard / mouse actions, drives Chromium over Playwright CDP, executes bash and
  code, manages the filesystem and Jupyter notebooks, and saves reusable browser auth
  states.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI Agents
- Virtual Desktops
- Computer Use
- Browser Automation
- Code Execution
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
apis:
- aid: scrapybara:scrapybara-instances-api
  name: Scrapybara Instances API
  tags:
  - Instances
  - Virtual Desktops
  - Ubuntu
  - Browser
  - Windows
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/api-reference/start
  baseURL: https://api.scrapybara.com/v1
  properties:
  - url: https://docs.scrapybara.com/api-reference/start
    type: Documentation
  - url: https://docs.scrapybara.com/api-reference/start
    type: APIReference
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Start, get, list, stop, pause, and resume cloud instances of type ubuntu,
    browser, or windows, with configurable timeout hours, blocked domains, and screen
    resolution. Paused instances preserve state and can be resumed later.
- aid: scrapybara:scrapybara-computer-actions-api
  name: Scrapybara Computer Actions API
  tags:
  - Computer Use
  - Screenshot
  - Mouse
  - Keyboard
  - Streaming
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/ubuntu
  baseURL: https://api.scrapybara.com/v1
  properties:
  - url: https://docs.scrapybara.com/ubuntu
    type: Documentation
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Drive a running desktop the way a human would - take a screenshot, get
    the interactive stream URL, and run computer actions (move mouse, click, drag,
    scroll, type text, press key combinations, wait) that computer-use models call
    directly.
- aid: scrapybara:scrapybara-browser-api
  name: Scrapybara Browser API
  tags:
  - Browser Automation
  - Playwright
  - CDP
  - Chromium
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/browser
  baseURL: https://api.scrapybara.com/v1
  properties:
  - url: https://docs.scrapybara.com/browser
    type: Documentation
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Start and stop a Chromium browser on an instance, retrieve its Playwright
    Chrome DevTools Protocol (CDP) URL for programmatic control, read the current URL,
    and authenticate the browser with a previously saved auth state.
- aid: scrapybara:scrapybara-code-execution-api
  name: Scrapybara Code Execution API
  tags:
  - Code Execution
  - Bash
  - Sandbox
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/code-execution
  baseURL: https://api.scrapybara.com/v1
  properties:
  - url: https://docs.scrapybara.com/code-execution
    type: Documentation
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Run bash commands and execute arbitrary code against a named kernel
    on an instance, capturing stdout, stderr, and results for agent workflows and
    data processing.
- aid: scrapybara:scrapybara-filesystem-api
  name: Scrapybara Filesystem API
  tags:
  - Filesystem
  - Files
  - Upload
  - Edit
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/filesystem
  baseURL: https://api.scrapybara.com/v1
  properties:
  - url: https://docs.scrapybara.com/filesystem
    type: Documentation
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Read, write, list, and manipulate files on an instance via file and
    edit actions, and upload binary files directly into the instance filesystem for
    agents to operate on.
- aid: scrapybara:scrapybara-notebook-api
  name: Scrapybara Notebook API
  tags:
  - Jupyter
  - Notebooks
  - Kernels
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/notebooks
  baseURL: https://api.scrapybara.com/v1
  properties:
  - url: https://docs.scrapybara.com/notebooks
    type: Documentation
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Create and manage Jupyter notebooks on an instance - list kernels, create
    and delete notebooks, add cells, and execute individual cells or the whole notebook.
- aid: scrapybara:scrapybara-auth-states-api
  name: Scrapybara Auth States API
  tags:
  - Auth States
  - Sessions
  - Cookies
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/browser#auth-states
  baseURL: https://api.scrapybara.com/v1
  properties:
  - url: https://docs.scrapybara.com/browser#auth-states
    type: Documentation
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Save the current browser session as a reusable auth state, list saved
    auth states, and modify them, so agents can skip repeated logins by replaying
    cookies and local storage across instances.
- aid: scrapybara:scrapybara-environment-api
  name: Scrapybara Environment API
  tags:
  - Environment Variables
  - Configuration
  - Secrets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.scrapybara.com/environment-variables
  baseURL: https://api.scrapybara.com/v1
