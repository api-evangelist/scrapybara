  - url: https://docs.scrapybara.com/environment-variables
    type: Documentation
  - url: openapi/scrapybara-openapi.yml
    type: OpenAPI
  description: Get, set, and delete environment variables on a running instance so
    agents and executed code can read API keys and configuration at runtime.
