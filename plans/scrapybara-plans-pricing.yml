specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Scrapybara
providerId: scrapybara
created: '2026-07-01'
modified: '2026-07-01'
reconciled: true
tags:
- AI Agents
- Virtual Desktops
- Computer Use
- Browser Automation
- Plans
description: >-
  Scrapybara meters usage in compute hours (time an instance is running) and
  agent credits (one credit per agent step when using the Act SDK or
  playground). Every plan bundles a monthly allotment of compute hours, agent
  credits, and concurrent instances; overage compute is billed per hour and
  extra agent credits at a flat per-credit rate, or you can bring your own model
  provider API key. A free tier is available and paid tiers scale up to a custom
  Enterprise agreement with self-hosting and an uptime SLA.
notes: >-
  Rates and allotments reflect the published Scrapybara pricing page as of the
  created date; verify current numbers on scrapybara.com/pricing during
  reconciliation.
sources:
- https://scrapybara.com/pricing
- https://scrapybara.com/
- https://docs.scrapybara.com
plans:
- id: scrapybara-free
  name: Free
  type: free
  description: >-
    Free tier for evaluation and light use, including a monthly allotment of
    compute hours, agent credits, and concurrent instances.
  entries:
  - label: Compute Hours
    name: compute_hours
    type: unit
    metric: hours
    limit: 10
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Agent Credits
    name: agent_credits
    type: unit
    metric: credits
    limit: 100
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Concurrent Instances
    name: concurrent_instances
    type: unit
    metric: instances
    limit: 5
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: Ubuntu / Browser / Windows Instances
  - name: Computer Actions
  - name: Browser Automation
  - name: Code Execution
- id: scrapybara-basic
  name: Basic
  type: subscription
  description: >-
    Entry paid plan with a larger monthly allotment of compute hours, agent
    credits, and concurrent instances.
  entries:
  - label: Monthly Subscription
    name: basic_subscription
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $29 per month
    userMultiplied: false
  - label: Compute Hours
    name: compute_hours
    type: unit
    metric: hours
    limit: 100
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Agent Credits
    name: agent_credits
    type: unit
    metric: credits
    limit: 500
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Concurrent Instances
    name: concurrent_instances
    type: unit
    metric: instances
    limit: 25
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: All Free features
  - name: Higher concurrency
- id: scrapybara-pro
  name: Pro
  type: subscription
  description: >-
    Higher-volume paid plan for production agent workloads with expanded compute
    hours, agent credits, and concurrent instances.
  entries:
  - label: Monthly Subscription
    name: pro_subscription
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $99 per month
    userMultiplied: false
  - label: Compute Hours
    name: compute_hours
    type: unit
    metric: hours
    limit: 500
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Agent Credits
    name: agent_credits
    type: unit
    metric: credits
    limit: 2500
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Concurrent Instances
    name: concurrent_instances
    type: unit
    metric: instances
    limit: 100
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Additional Agent Credits
    name: extra_agent_credits
    type: usage
    metric: credits
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0.04 per credit
    userMultiplied: false
  elements:
  - name: All Basic features
  - name: Credit top-ups
  - name: Bring your own provider API key
- id: scrapybara-enterprise
  name: Enterprise
  type: enterprise
  description: >-
    Custom agreement with self-hosting, dedicated support, and a 99.9% uptime
    SLA. Contact Scrapybara sales.
  entries:
  - label: Enterprise Agreement
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Self-hosting
  - name: Dedicated support
  - name: 99.9% uptime SLA
  - name: Custom volume pricing
