sources:
  - url: https://docs.scrapybara.com
    type: Documentation
    note: Overview of instances, computer use, browser, code execution, filesystem, notebooks; REST API with x-api-key.
  - url: https://docs.scrapybara.com/api-reference/start
    type: APIReference
    note: Start instance endpoint documented as POST /v1/start with x-api-key header; no WebSocket surface.
  - url: https://docs.scrapybara.com/browser
    type: Documentation
    note: Browser control via Playwright CDP URL and save/load auth states; no documented Scrapybara WebSocket API.
  - url: https://github.com/Scrapybara/scrapybara-python
    type: SDK
    note: Python SDK methods map to REST endpoints under the v1 base path.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No first-party WebSocket application API exists to model. The interactive
    stream is a hosted viewer URL and browser automation uses standard Chromium
    CDP surfaced for the customer's own Playwright client, so no AsyncAPI
    document was authored. The apis.yml catalogs the documented REST surfaces.
