aid: scrapybara
name: Scrapybara
review:
  question: Does Scrapybara expose a documented public WebSocket API?
  answer: false
  date: '2026-07-01'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Scrapybara's public API is REST/HTTPS
    over https://api.scrapybara.com/v1 authenticated with the x-api-key
    header. The interactive desktop stream is delivered as a hosted
    stream URL (returned by GET /instances/{id}/stream-url) and browser
    control is performed by connecting Playwright to a Chrome DevTools
    Protocol (CDP) endpoint, not by calling a documented Scrapybara
    WebSocket API surface. No first-party ws:// or wss:// API is documented.
findings:
  summary: |
    Scrapybara does not publish a documented public WebSocket API. The
    documented API is REST/HTTPS under https://api.scrapybara.com/v1 with
    x-api-key authentication. Two transports touch real-time/streaming but
    are not first-party Scrapybara WebSocket APIs: (1) the interactive
    desktop stream is a hosted stream URL clients open in a viewer, and
    (2) browser automation uses the Chrome DevTools Protocol (CDP) URL
    returned by the API, which callers connect to with Playwright. CDP
    itself runs over WebSocket at the browser layer, but it is a standard
    Chromium protocol surfaced for the customer's own Playwright client,
    not a documented Scrapybara application API.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.scrapybara.com/v1
      documented: true
    - protocol: CDP (Chrome DevTools Protocol)
      scheme: ws
      note: The API returns a CDP URL (GET /instances/{id}/browser/cdp-url) that the customer connects to with Playwright. This is standard Chromium CDP, not a documented Scrapybara application WebSocket API.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No first-party Scrapybara WebSocket application API is documented in the API reference.
